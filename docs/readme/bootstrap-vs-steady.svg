<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Bootstrap versus steady state ingestion</title><desc id="desc">Animated comparison of disposable dual GPU bootstrap ingestion and normal Railway incremental synchronization converging on the same source snapshot contract.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070c13"/><stop offset="1" stop-color="#0b1421"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>.t{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#e8eff8}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;fill:#8190a7}.b{fill:#0d1623;stroke:#25374d}.c{stroke:#22d3ee}.a{stroke:#f59e0b}.f{fill:none;stroke:#22d3ee;stroke-width:2.6;stroke-dasharray:8 10;animation:d 2s linear infinite}.fa{fill:none;stroke:#f59e0b;stroke-width:2.6;stroke-dasharray:8 10;animation:d 2.5s linear infinite}.p{animation:p 1.4s ease-in-out infinite}@keyframes d{to{stroke-dashoffset:-36}}@keyframes p{50%{opacity:.25}}</style></defs>
<rect width="1200" height="520" rx="26" fill="url(#bg)"/><text x="52" y="54" class="t" font-size="25" font-weight="800">Two execution paths. One knowledge contract.</text><text x="52" y="80" class="m" font-size="10">HEAVY INITIAL COMPUTE IS DISPOSABLE. SOURCE SNAPSHOT SEMANTICS, PROVENANCE AND PRODUCTION STATE ARE DURABLE.</text>
<text x="54" y="126" class="t" font-size="13" font-weight="700">BOOTSTRAP / ONE-SHOT</text><text x="54" y="146" class="m" font-size="9">optimize first corpus build for throughput</text>
<g transform="translate(54 170)"><rect class="b c" width="170" height="90" rx="14"/><text x="16" y="29" class="t" font-size="12" font-weight="700">6 source families</text><text x="16" y="52" class="m" font-size="8">GitHub discovery</text><text x="16" y="69" class="m" font-size="8">production registry rules</text></g>
<g transform="translate(278 170)"><rect class="b c" width="170" height="90" rx="14"/><text x="16" y="29" class="t" font-size="12" font-weight="700">Dual-GPU worker</text><text x="16" y="52" class="m" font-size="8">SmartChunker</text><text x="16" y="69" class="m" font-size="8">dense + sparse batches</text></g>
<g transform="translate(502 170)"><rect class="b" width="170" height="90" rx="14"/><text x="16" y="29" class="t" font-size="12" font-weight="700">Direct index write</text><text x="16" y="52" class="m" font-size="8">same vector names</text><text x="16" y="69" class="m" font-size="8">same payload contract</text></g>
<g transform="translate(726 170)"><rect class="b a" width="170" height="90" rx="14"/><text x="16" y="29" class="t" font-size="12" font-weight="700">Snapshot adoption</text><text x="16" y="52" class="m" font-size="8">validate counts / ref</text><text x="16" y="69" class="m" font-size="8">reconcile production state</text></g>
<path class="f" d="M224 215H278M448 215H502M672 215H726"/><circle cx="251" cy="215" r="4" fill="#22d3ee" filter="url(#g)" class="p"/><circle cx="475" cy="215" r="4" fill="#22d3ee" filter="url(#g)" class="p"/><circle cx="699" cy="215" r="4" fill="#f59e0b" filter="url(#g)" class="p"/>
<text x="54" y="326" class="t" font-size="13" font-weight="700">STEADY STATE / PRODUCTION</text><text x="54" y="346" class="m" font-size="9">optimize normal operation for small deltas and observability</text>
<g transform="translate(54 370)"><rect class="b" width="170" height="90" rx="14"/><text x="16" y="29" class="t" font-size="12" font-weight="700">Scheduler</text><text x="16" y="52" class="m" font-size="8">periodic source checks</text><text x="16" y="69" class="m" font-size="8">detect upstream change</text></g>
<g transform="translate(278 370)"><rect class="b" width="170" height="90" rx="14"/><text x="16" y="29" class="t" font-size="12" font-weight="700">Incremental diff</text><text x="16" y="52" class="m" font-size="8">added / modified</text><text x="16" y="69" class="m" font-size="8">deleted / unchanged</text></g>
<g transform="translate(502 370)"><rect class="b" width="170" height="90" rx="14"/><text x="16" y="29" class="t" font-size="12" font-weight="700">Private worker</text><text x="16" y="52" class="m" font-size="8">changed files only</text><text x="16" y="69" class="m" font-size="8">Redis source lock</text></g>
<g transform="translate(726 370)"><rect class="b a" width="170" height="90" rx="14"/><text x="16" y="29" class="t" font-size="12" font-weight="700">Snapshot advance</text><text x="16" y="52" class="m" font-size="8">remove stale points</text><text x="16" y="69" class="m" font-size="8">commit source state</text></g>
<path class="fa" d="M224 415H278M448 415H502M672 415H726"/>
<g transform="translate(950 184)"><rect class="b c" width="198" height="262" rx="18"/><text x="20" y="34" class="t" font-size="14" font-weight="800">Shared contract</text><text x="20" y="66" class="m" font-size="8">source_id</text><text x="20" y="88" class="m" font-size="8">repository / ref</text><text x="20" y="110" class="m" font-size="8">snapshot commit</text><text x="20" y="132" class="m" font-size="8">chunk payload</text><text x="20" y="154" class="m" font-size="8">dense vector</text><text x="20" y="176" class="m" font-size="8">sparse vector</text><text x="20" y="198" class="m" font-size="8">file manifest</text><text x="20" y="220" class="m" font-size="8">indexed count</text><text x="20" y="244" class="t" font-size="10" font-weight="700">→ same query plane</text></g>
<path class="f" d="M896 215H950"/><path class="fa" d="M896 415H950"/>
</svg>