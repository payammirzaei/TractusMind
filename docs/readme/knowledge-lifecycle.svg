<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">TractusMind knowledge lifecycle</title>
  <desc id="desc">Animated flow from curated Tractus-X repositories to user-visible grounded evidence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071018"/><stop offset="1" stop-color="#0b1420"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .t{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#e6edf6}.s{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;fill:#7e8ba1}.b{fill:#0d1724;stroke:#26364a}.c{stroke:#22d3ee}.a{stroke:#f59e0b}.line{fill:none;stroke:#26394f;stroke-width:3}.dash{fill:none;stroke:#22d3ee;stroke-width:3;stroke-dasharray:8 11;animation:d 2s linear infinite}.dash2{fill:none;stroke:#f59e0b;stroke-width:3;stroke-dasharray:8 11;animation:d 2.4s linear infinite}.p{animation:p 1.6s ease-in-out infinite}@keyframes d{to{stroke-dashoffset:-38}}@keyframes p{50%{opacity:.25}}
    </style>
  </defs>
  <rect width="1200" height="430" rx="26" fill="url(#bg)"/>
  <text x="52" y="54" class="t" font-size="25" font-weight="800">Knowledge lifecycle — from upstream source to inspectable answer</text>
  <text x="52" y="80" class="s" font-size="10">THE SYSTEM DOES NOT “UPLOAD DOCUMENTS”. IT MAINTAINS VERSIONED SOURCE SNAPSHOTS AND PROVENANCE-CARRYING CHUNKS.</text>

  <g transform="translate(52 126)"><rect class="b c" width="148" height="152" rx="16"/><text x="18" y="32" class="t" font-size="14" font-weight="700">Curated sources</text><text x="18" y="60" class="s" font-size="9">tractusx-docs</text><text x="18" y="79" class="s" font-size="9">tractusx-sdk</text><text x="18" y="98" class="s" font-size="9">tractusx-edc</text><text x="18" y="117" class="s" font-size="9">semantic-models</text><text x="18" y="136" class="s" font-size="9">digital-twin + release</text></g>
  <g transform="translate(238 126)"><rect class="b" width="148" height="152" rx="16"/><text x="18" y="32" class="t" font-size="14" font-weight="700">Discover</text><text x="18" y="62" class="s" font-size="9">resolve ref</text><text x="18" y="81" class="s" font-size="9">diff files</text><text x="18" y="100" class="s" font-size="9">fetch changed</text><text x="18" y="119" class="s" font-size="9">capture commit</text></g>
  <g transform="translate(424 126)"><rect class="b" width="148" height="152" rx="16"/><text x="18" y="32" class="t" font-size="14" font-weight="700">Normalize</text><text x="18" y="62" class="s" font-size="9">parse structure</text><text x="18" y="81" class="s" font-size="9">smart chunk</text><text x="18" y="100" class="s" font-size="9">line ranges</text><text x="18" y="119" class="s" font-size="9">source metadata</text></g>
  <g transform="translate(610 126)"><rect class="b c" width="148" height="152" rx="16"/><text x="18" y="32" class="t" font-size="14" font-weight="700">Index</text><text x="18" y="62" class="s" font-size="9">dense vector</text><text x="18" y="81" class="s" font-size="9">sparse BM25</text><text x="18" y="100" class="s" font-size="9">Qdrant point</text><text x="18" y="119" class="s" font-size="9">snapshot payload</text></g>
  <g transform="translate(796 126)"><rect class="b" width="148" height="152" rx="16"/><text x="18" y="32" class="t" font-size="14" font-weight="700">Retrieve</text><text x="18" y="62" class="s" font-size="9">route query</text><text x="18" y="81" class="s" font-size="9">hybrid search</text><text x="18" y="100" class="s" font-size="9">RRF + rerank</text><text x="18" y="119" class="s" font-size="9">evidence gate</text></g>
  <g transform="translate(982 126)"><rect class="b a" width="166" height="152" rx="16"/><text x="18" y="32" class="t" font-size="14" font-weight="700">Show the user</text><text x="18" y="62" class="s" font-size="9">grounded answer</text><text x="18" y="81" class="s" font-size="9">citations</text><text x="18" y="100" class="s" font-size="9">claims + verification</text><text x="18" y="119" class="s" font-size="9">repo / ref / lines</text></g>

  <path class="dash" d="M200 202H238M386 202H424M572 202H610M758 202H796"/><path class="dash2" d="M944 202H982"/>
  <circle cx="219" cy="202" r="5" fill="#22d3ee" filter="url(#glow)" class="p"/><circle cx="405" cy="202" r="5" fill="#22d3ee" filter="url(#glow)" class="p"/><circle cx="591" cy="202" r="5" fill="#22d3ee" filter="url(#glow)" class="p"/><circle cx="777" cy="202" r="5" fill="#22d3ee" filter="url(#glow)" class="p"/><circle cx="963" cy="202" r="5" fill="#f59e0b" filter="url(#glow)" class="p"/>

  <g transform="translate(52 316)"><rect x="0" y="0" width="1096" height="66" rx="13" fill="#0a111b" stroke="#1f2c3d"/><text x="18" y="24" class="t" font-size="11" font-weight="700">PROVENANCE CONTRACT</text><text x="18" y="46" class="s" font-size="9">source_id → repository → configured ref → snapshot commit → content commit → path → line range → chunk id → retrieval scores → citation id</text></g>
</svg>