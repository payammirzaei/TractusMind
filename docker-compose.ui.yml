services:
  frontend:
    build: ./frontend
    environment:
      TRACTUSMIND_API_URL: http://api:8000
      TRACTUSMIND_OIDC_ENABLED: ${OIDC_ENABLED:-false}
      TRACTUSMIND_OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      TRACTUSMIND_OIDC_CLIENT_ID: ${TRACTUSMIND_OIDC_CLIENT_ID:-}
      TRACTUSMIND_OIDC_SCOPES: ${TRACTUSMIND_OIDC_SCOPES:-openid profile email}
      TRACTUSMIND_OIDC_REDIRECT_URI: ${TRACTUSMIND_OIDC_REDIRECT_URI:-}
    ports:
      - "3100:3000"
    depends_on:
      - api
