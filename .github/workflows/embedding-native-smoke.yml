# Temporary diagnostic: rerun against the tree-sitter node snapshot fix.
name: Embedding Native Smoke

on:
  pull_request:
    paths:
      - ".github/workflows/embedding-native-smoke.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        kind: [dense, sparse]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Probe dense FastEmbed path
        if: ${{ matrix.kind == 'dense' }}
        shell: bash
        run: |
          set -euo pipefail
          python -X faulthandler - <<'PY'
          import asyncio
          from app.embeddings.service import DenseEmbeddingService

          async def main():
              service = DenseEmbeddingService("BAAI/bge-small-en-v1.5", batch_size=2)
              vectors = await service.embed_documents([
                  "Tractus-X connector architecture",
                  "EDC data plane debugging",
              ])
              assert len(vectors) == 2
              assert len(vectors[0]) == service.dimension
              print(f"dense-pass dimension={service.dimension}")

          asyncio.run(main())
          PY
      - name: Probe sparse FastEmbed BM25 path
        if: ${{ matrix.kind == 'sparse' }}
        shell: bash
        run: |
          set -euo pipefail
          python -X faulthandler - <<'PY'
          import asyncio
          from app.embeddings.sparse import SparseEmbeddingService

          async def main():
              service = SparseEmbeddingService("Qdrant/bm25", batch_size=2)
              vectors = await service.embed_documents([
                  "Tractus-X connector architecture",
                  "EDC data plane debugging",
              ])
              assert len(vectors) == 2
              assert vectors[0].indices
              print(f"sparse-pass terms={len(vectors[0].indices)}")

          asyncio.run(main())
          PY

  sdk-stages:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Trace tractusx-sdk fetch, chunk and embedding stages
        shell: bash
        run: |
          set -euo pipefail
          python -X faulthandler - <<'PY'
          import asyncio

          from app.chunking import SmartChunker
          from app.core.config import get_settings
          from app.embeddings.service import DenseEmbeddingService
          from app.embeddings.sparse import SparseEmbeddingService
          from app.embeddings.text import build_embedding_text, build_sparse_text
          from app.ingestion.pipeline import SourceIngestionPipeline
          from app.ingestion.registry import get_source

          async def main():
              settings = get_settings()
              source = get_source("tractusx-sdk")
              async with SourceIngestionPipeline(
                  token=settings.github_token,
                  timeout=settings.github_timeout_seconds,
                  max_attempts=settings.github_max_attempts,
                  retry_base_seconds=settings.provider_retry_base_seconds,
                  retry_max_seconds=settings.provider_retry_max_seconds,
                  circuit_failure_threshold=settings.provider_circuit_failure_threshold,
                  circuit_cooldown_seconds=settings.provider_circuit_cooldown_seconds,
              ) as pipeline:
                  print("stage=fetch start", flush=True)
                  manifest, documents = await pipeline.fetch(source)
                  print(
                      f"stage=fetch pass files={len(manifest.files)} documents={len(documents)}",
                      flush=True,
                  )

              chunker = SmartChunker()
              chunks = []
              for index, document in enumerate(documents, start=1):
                  print(
                      f"stage=chunk before index={index} path={document.path} "
                      f"language={document.language} type={document.content_type}",
                      flush=True,
                  )
                  produced = chunker.chunk(document)
                  chunks.extend(produced)
                  print(
                      f"stage=chunk after index={index} produced={len(produced)} total={len(chunks)}",
                      flush=True,
                  )
              print(f"stage=chunk pass chunks={len(chunks)}", flush=True)

              dense = DenseEmbeddingService(
                  settings.embedding_model,
                  batch_size=settings.embedding_batch_size,
              )
              for start in range(0, len(chunks), settings.embedding_batch_size):
                  batch = chunks[start : start + settings.embedding_batch_size]
                  print(
                      f"stage=dense before start={start} size={len(batch)} "
                      f"first={batch[0].path if batch else '-'}",
                      flush=True,
                  )
                  vectors = await dense.embed_documents(
                      [build_embedding_text(chunk) for chunk in batch]
                  )
                  assert len(vectors) == len(batch)
                  print(f"stage=dense after start={start}", flush=True)
              print("stage=dense pass", flush=True)

              sparse = SparseEmbeddingService(
                  settings.sparse_embedding_model,
                  batch_size=settings.sparse_embedding_batch_size,
              )
              for start in range(0, len(chunks), settings.sparse_embedding_batch_size):
                  batch = chunks[start : start + settings.sparse_embedding_batch_size]
                  print(
                      f"stage=sparse before start={start} size={len(batch)} "
                      f"first={batch[0].path if batch else '-'}",
                      flush=True,
                  )
                  vectors = await sparse.embed_documents(
                      [build_sparse_text(chunk) for chunk in batch]
                  )
                  assert len(vectors) == len(batch)
                  print(f"stage=sparse after start={start}", flush=True)
              print("stage=sparse pass", flush=True)

          asyncio.run(main())
          PY
