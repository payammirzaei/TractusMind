name: Embedding Native Smoke

on:
  pull_request:
    paths:
      - ".github/workflows/embedding-native-smoke.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        kind: [dense, sparse]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Probe dense FastEmbed path
        if: ${{ matrix.kind == 'dense' }}
        shell: bash
        run: |
          set -euo pipefail
          python -X faulthandler - <<'PY'
          import asyncio
          from app.embeddings.service import DenseEmbeddingService

          async def main():
              service = DenseEmbeddingService("BAAI/bge-small-en-v1.5", batch_size=2)
              vectors = await service.embed_documents([
                  "Tractus-X connector architecture",
                  "EDC data plane debugging",
              ])
              assert len(vectors) == 2
              assert len(vectors[0]) == service.dimension
              print(f"dense-pass dimension={service.dimension}")

          asyncio.run(main())
          PY

      - name: Probe sparse FastEmbed BM25 path
        if: ${{ matrix.kind == 'sparse' }}
        shell: bash
        run: |
          set -euo pipefail
          python -X faulthandler - <<'PY'
          import asyncio
          from app.embeddings.sparse import SparseEmbeddingService

          async def main():
              service = SparseEmbeddingService("Qdrant/bm25", batch_size=2)
              vectors = await service.embed_documents([
                  "Tractus-X connector architecture",
                  "EDC data plane debugging",
              ])
              assert len(vectors) == 2
              assert vectors[0].indices
              print(f"sparse-pass terms={len(vectors[0].indices)}")

          asyncio.run(main())
          PY
