name: Frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "docker-compose.yml"
      - "docker-compose.prod.yml"
      - "docker-compose.ui.yml"
      - "docker-compose.ui.prod.yml"
      - "config/Caddyfile.ui.prod"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "docker-compose.yml"
      - "docker-compose.prod.yml"
      - "docker-compose.ui.yml"
      - "docker-compose.ui.prod.yml"
      - "config/Caddyfile.ui.prod"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          package-manager-cache: false

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        env:
          TRACTUSMIND_API_URL: http://127.0.0.1:8000
        run: npm run build

      - name: Smoke production routes
        env:
          TRACTUSMIND_API_URL: http://127.0.0.1:8000
          SMOKE_BASE_URL: http://127.0.0.1:3100
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3100 > /tmp/tractusmind-ui.log 2>&1 &
          UI_PID=$!
          trap 'kill "$UI_PID" 2>/dev/null || true' EXIT
          npm run smoke

      - name: Build runtime image
        run: docker build -t tractusmind-ui:ci .

      - name: Validate development UI topology
        run: >-
          docker compose
          -f ../docker-compose.yml
          -f ../docker-compose.ui.yml
          config --quiet

      - name: Prepare production topology fixture
        run: cp ../.env.production.example ../.env.production

      - name: Validate production UI topology
        run: >-
          docker compose
          --env-file ../.env.production
          -f ../docker-compose.prod.yml
          -f ../docker-compose.ui.prod.yml
          config --quiet
