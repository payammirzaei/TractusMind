name: Frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "docker-compose.yml"
      - "docker-compose.prod.yml"
      - "docker-compose.ui.yml"
      - "docker-compose.ui.prod.yml"
      - "config/Caddyfile.ui.prod"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "docker-compose.yml"
      - "docker-compose.prod.yml"
      - "docker-compose.ui.yml"
      - "docker-compose.ui.prod.yml"
      - "config/Caddyfile.ui.prod"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          package-manager-cache: false

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        env:
          TRACTUSMIND_API_URL: http://127.0.0.1:8000
        run: npm run build

      - name: Smoke production runtime, BFF and OIDC boundary
        env:
          TRACTUSMIND_API_URL: http://127.0.0.1:8000
          TRACTUSMIND_OIDC_ISSUER_URL: http://127.0.0.1:8001
          TRACTUSMIND_OIDC_CLIENT_ID: tractusmind-ci
          TRACTUSMIND_OIDC_SCOPES: openid profile email
          SMOKE_BASE_URL: http://127.0.0.1:3100
        run: |
          npm run mock:backend > /tmp/tractusmind-mock-backend.log 2>&1 &
          BACKEND_PID=$!
          npm run mock:oidc > /tmp/tractusmind-mock-oidc.log 2>&1 &
          OIDC_PID=$!
          npm run start -- --hostname 127.0.0.1 --port 3100 > /tmp/tractusmind-ui.log 2>&1 &
          UI_PID=$!
          cleanup() {
            kill "$UI_PID" 2>/dev/null || true
            kill "$OIDC_PID" 2>/dev/null || true
            kill "$BACKEND_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          npm run smoke
          npm run smoke:bff
          npm run smoke:oidc

      - name: Build runtime image
        run: docker build -t tractusmind-ui:ci .

      - name: Smoke built runtime image
        env:
          SMOKE_BASE_URL: http://127.0.0.1:3101
        run: |
          MOCK_BACKEND_HOST=0.0.0.0 npm run mock:backend > /tmp/tractusmind-image-mock-backend.log 2>&1 &
          BACKEND_PID=$!
          UI_CID=$(docker run -d \
            --add-host=host.docker.internal:host-gateway \
            -p 127.0.0.1:3101:3000 \
            -e TRACTUSMIND_API_URL=http://host.docker.internal:8000 \
            tractusmind-ui:ci)
          cleanup() {
            docker rm -f "$UI_CID" >/dev/null 2>&1 || true
            kill "$BACKEND_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          npm run smoke
          npm run smoke:bff

      - name: Validate development UI topology
        run: >-
          docker compose
          -f ../docker-compose.yml
          -f ../docker-compose.ui.yml
          config --quiet

      - name: Prepare production topology fixture
        run: cp ../.env.production.example ../.env.production

      - name: Validate production UI topology
        run: >-
          docker compose
          --env-file ../.env.production
          -f ../docker-compose.prod.yml
          -f ../docker-compose.ui.prod.yml
          config --quiet
