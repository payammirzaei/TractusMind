name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Scan repository filesystem
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Build backend image
        run: docker build -t tractusmind:security .

      - name: Scan backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: tractusmind:security
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          # pip 26.2+ ships a CycloneDX inventory for its isolated vendored code.
          # Installed Python distributions remain scanned from their normal METADATA.
          skip-files: "**/pip/_vendor/bom.cdx.json"
          exit-code: "1"

      - name: Build Mission Control image
        run: docker build -t tractusmind-ui:security ./frontend

      - name: Scan Mission Control image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: tractusmind-ui:security
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
