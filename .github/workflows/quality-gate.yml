name: Production Quality Gate

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  quality-gate:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.QUALITY_GATE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: quality
    services:
      postgres:
        image: postgres:17.10-alpine
        env:
          POSTGRES_DB: tractusmind
          POSTGRES_USER: tractusmind
          POSTGRES_PASSWORD: tractusmind
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tractusmind -d tractusmind"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.19.0
        ports:
          - 6333:6333
    env:
      DATABASE_URL: postgresql+asyncpg://tractusmind:tractusmind@127.0.0.1:5432/tractusmind
      QDRANT_URL: http://127.0.0.1:6333
      QDRANT_COLLECTION: tractusmind_quality_gate_${{ github.run_id }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      LLM_BASE_URL: ${{ secrets.QUALITY_LLM_BASE_URL }}
      LLM_API_KEY: ${{ secrets.QUALITY_LLM_API_KEY }}
      LLM_MODEL: ${{ vars.QUALITY_LLM_MODEL }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Validate only the external quality inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GITHUB_TOKEN" || { echo "GitHub Actions token is unavailable"; exit 2; }
          test -n "$LLM_BASE_URL" || { echo "QUALITY_LLM_BASE_URL is required"; exit 2; }
          test -n "$LLM_API_KEY" || { echo "QUALITY_LLM_API_KEY is required"; exit 2; }
          test -n "$LLM_MODEL" || { echo "QUALITY_LLM_MODEL variable is required"; exit 2; }

      - name: Verify public Tractus-X source access with the job token
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            https://api.github.com/repos/eclipse-tractusx/tractusx-sdk \
            >/dev/null

      - name: Wait for ephemeral Qdrant
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:6333/readyz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Qdrant did not become ready"
          exit 1

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Bootstrap isolated quality database schema
        run: tractusmind-db bootstrap

      - name: Prepare reports
        run: mkdir -p artifacts/quality artifacts/quality/sync

      - name: Build a fresh six-source quality corpus
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > artifacts/quality/enabled-sources.txt
          from app.ingestion.registry import get_enabled_sources

          for source in get_enabled_sources():
              print(source.id)
          PY
          while IFS= read -r source_id; do
            echo "Synchronizing ${source_id}"
            tractusmind-ingest sync "$source_id" \
              | tee "artifacts/quality/sync/${source_id}.json"
          done < artifacts/quality/enabled-sources.txt

      - name: Validate full corpus snapshot and upstream freshness
        run: >-
          tractusmind-corpus-validate --verify-upstream
          > artifacts/quality/corpus.json

      - name: Run full corpus retrieval report
        run: |
          tractusmind-benchmark \
            --dataset benchmarks/full_corpus_v1.jsonl \
            --mode rerank \
            --k 5 > artifacts/quality/retrieval-full.json

      - name: Run debug report
        run: |
          tractusmind-benchmark \
            --dataset benchmarks/debug_v0.jsonl \
            --mode rerank \
            --k 5 > artifacts/quality/debug.json

      - name: Calibrate evidence threshold
        run: |
          tractusmind-answer-eval calibrate \
            --dataset benchmarks/answer_v1.jsonl \
            --max-unsafe-rate 0 \
            > artifacts/quality/calibration.json

      - name: Load pinned production threshold
        shell: bash
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          config = tomllib.loads(Path("config/quality_gate.toml").read_text())
          threshold = config.get("calibration", {}).get("minimum_relevance_score")
          if threshold is not None:
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
                  handle.write(f"MINIMUM_RELEVANCE_SCORE={float(threshold)}\n")
          PY

      - name: Run grounded answer safety report at pinned threshold
        run: |
          tractusmind-answer-eval evaluate \
            --dataset benchmarks/answer_v1.jsonl \
            > artifacts/quality/answer-full.json

      - name: Run reviewed regression datasets
        shell: bash
        run: |
          set -euo pipefail
          if [ -s benchmarks/regressions/retrieval.jsonl ]; then
            tractusmind-benchmark \
              --dataset benchmarks/regressions/retrieval.jsonl \
              --mode rerank --k 5 \
              > artifacts/quality/retrieval-regression.json
          fi
          if [ -s benchmarks/regressions/debug.jsonl ]; then
            tractusmind-benchmark \
              --dataset benchmarks/regressions/debug.jsonl \
              --mode rerank --k 5 \
              > artifacts/quality/debug-regression.json
          fi
          if [ -s benchmarks/regressions/answer.jsonl ]; then
            tractusmind-answer-eval evaluate \
              --dataset benchmarks/regressions/answer.jsonl \
              > artifacts/quality/answer-regression.json
          fi

      - name: Enforce production quality contracts
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --config config/quality_gate.toml
            --calibration artifacts/quality/calibration.json
            --answer artifacts/quality/answer-full.json
            --require-pinned-threshold
          )
          if [ -f artifacts/quality/retrieval-regression.json ]; then
            args+=(--retrieval-regression artifacts/quality/retrieval-regression.json)
          fi
          if [ -f artifacts/quality/debug-regression.json ]; then
            args+=(--debug-regression artifacts/quality/debug-regression.json)
          fi
          if [ -f artifacts/quality/answer-regression.json ]; then
            args+=(--answer-regression artifacts/quality/answer-regression.json)
          fi
          tractusmind-quality-gate "${args[@]}" | tee artifacts/quality/gate.json

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tractusmind-quality-${{ github.sha }}
          path: artifacts/quality
          if-no-files-found: warn
          retention-days: 90
