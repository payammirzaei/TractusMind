name: CPU Performance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/cpu-performance.yml"
      - "app/core/config.py"
      - "app/embeddings/**"
      - "app/reranking/**"
      - "app/retrieval/**"
      - "app/evaluation/performance_cli.py"
      - "benchmarks/full_corpus_v1.jsonl"
      - "tests/test_performance_cli.py"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      NUMEXPR_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Verify benchmark helpers
        run: pytest -q tests/test_performance_cli.py

      - name: Record CPU environment
        shell: bash
        run: |
          set -euo pipefail
          lscpu
          echo "nproc=$(nproc)"
          python - <<'PY'
          import os
          print(f"python cpu_count={os.cpu_count()}")
          print(f"initial affinity={sorted(os.sched_getaffinity(0))}")
          PY

      - name: Measure production model path on at most two CPUs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          affinity="$(python - <<'PY'
          import os
          cpus = sorted(os.sched_getaffinity(0))[:2]
          print(",".join(str(cpu) for cpu in cpus))
          PY
          )"
          test -n "$affinity"
          echo "Constraining benchmark process to CPU affinity ${affinity}"
          taskset -c "$affinity" tractusmind-perf \
            --dataset benchmarks/full_corpus_v1.jsonl \
            --iterations 2 \
            --candidate-count 20 \
            --candidate-chars 1200 \
            --rerank-limit 6 \
            --output artifacts/cpu-performance.json

      - name: Publish measurement summary
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          report = json.loads(Path("artifacts/cpu-performance.json").read_text())
          env = report["environment"]
          steady = report["steady_state"]
          cold = report["cold_start"]

          print("## CPU-only retrieval measurement")
          print()
          print(
              f"Affinity: `{env['cpu_affinity']}` · max RSS: "
              f"`{env['max_rss_mb']:.1f} MiB`"
          )
          print()
          print("| Stage | p50 | p95 | max |")
          print("| --- | ---: | ---: | ---: |")
          for label, key in [
              ("Dense query", "dense_query"),
              ("Sparse query", "sparse_query"),
              ("Rerank 20 → 6", "rerank"),
              ("Combined model compute", "combined_model_compute"),
          ]:
              item = steady[key]
              print(
                  f"| {label} | {item['p50_ms']:.1f} ms | "
                  f"{item['p95_ms']:.1f} ms | {item['max_ms']:.1f} ms |"
              )
          print()
          print(
              "Cold model initialization: "
              f"`{cold['combined_model_seconds']:.2f} s` "
              "(may include first-run model downloads)."
          )
          print()
          print(
              "This measurement intentionally excludes Qdrant network/search and external "
              "LLM latency. Budgets are pinned only after measurement evidence exists."
          )
          PY

      - name: Upload CPU performance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tractusmind-cpu-performance-${{ github.sha }}
          path: artifacts/cpu-performance.json
          if-no-files-found: warn
          retention-days: 90
