name: Corpus Calibration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibrate:
    # Expensive release-candidate measurement. Run manually after focused regressions are green.
    runs-on: ubuntu-latest
    timeout-minutes: 300
    services:
      postgres:
        image: postgres:17.10-alpine
        env:
          POSTGRES_DB: tractusmind
          POSTGRES_USER: tractusmind
          POSTGRES_PASSWORD: tractusmind
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tractusmind -d tractusmind"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.19.0
        ports:
          - 6333:6333
    env:
      DATABASE_URL: postgresql+asyncpg://tractusmind:tractusmind@127.0.0.1:5432/tractusmind
      QDRANT_URL: http://127.0.0.1:6333
      QDRANT_COLLECTION: tractusmind_calibration_${{ github.run_id }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify public Tractus-X source access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GITHUB_TOKEN"
          curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            https://api.github.com/repos/eclipse-tractusx/tractusx-sdk \
            >/dev/null

      - name: Wait for ephemeral Qdrant
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:6333/readyz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Qdrant did not become ready"
          exit 1

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Verify ingestion regression coverage
        run: pytest -q tests/test_content_fetcher.py tests/test_chunking.py

      - name: Bootstrap isolated calibration database
        run: tractusmind-db bootstrap

      - name: Prepare evidence directory
        run: mkdir -p artifacts/calibration/sync

      - name: Record and synchronize every enabled source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee artifacts/calibration/enabled-sources.txt
          from app.ingestion.registry import get_enabled_sources

          for source in get_enabled_sources():
              print(source.id)
          PY

          failures=()
          while IFS= read -r source_id; do
            echo "Synchronizing ${source_id}"
            if ! tractusmind-ingest sync "$source_id" \
              | tee "artifacts/calibration/sync/${source_id}.json"; then
              echo "Source synchronization failed: ${source_id}" >&2
              failures+=("$source_id")
            fi
          done < artifacts/calibration/enabled-sources.txt

          if (( ${#failures[@]} > 0 )); then
            printf '%s\n' "${failures[@]}" | tee artifacts/calibration/failed-sources.txt
            echo "Corpus synchronization failed for ${#failures[@]} source(s)." >&2
            exit 1
          fi

      - name: Validate full corpus and upstream refs
        run: >-
          tractusmind-corpus-validate --verify-upstream
          > artifacts/calibration/corpus.json

      - name: Run six-source retrieval benchmark
        run: |
          tractusmind-benchmark \
            --dataset benchmarks/full_corpus_v1.jsonl \
            --mode all --k 5 \
            > artifacts/calibration/retrieval.json

      - name: Run debug retrieval benchmark
        run: |
          tractusmind-benchmark \
            --dataset benchmarks/debug_v0.jsonl \
            --mode rerank --k 5 \
            > artifacts/calibration/debug.json

      - name: Measure zero-unsafe evidence threshold
        run: |
          tractusmind-answer-eval calibrate \
            --dataset benchmarks/answer_v1.jsonl \
            --max-unsafe-rate 0 \
            > artifacts/calibration/calibration.json

      - name: Build pin candidate and reproducibility manifest
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("artifacts/calibration")
          calibration = json.loads((root / "calibration.json").read_text())
          corpus = json.loads((root / "corpus.json").read_text())
          retrieval = json.loads((root / "retrieval.json").read_text())
          threshold = float(calibration["recommended_threshold"])
          inputs = [
              Path("config/sources.toml"),
              Path("benchmarks/full_corpus_v1.jsonl"),
              Path("benchmarks/debug_v0.jsonl"),
              Path("benchmarks/answer_v1.jsonl"),
          ]
          manifest = {
              "git_sha": "${{ github.sha }}",
              "recommended_threshold": threshold,
              "corpus_registry_sha256": corpus["registry_sha256"],
              "upstream_verified": corpus["upstream_verified"],
              "dense_model": retrieval["dense_model"],
              "sparse_model": retrieval["sparse_model"],
              "reranker_model": retrieval["reranker_model"],
              "input_sha256": {
                  str(path): hashlib.sha256(path.read_bytes()).hexdigest()
                  for path in inputs
              },
          }
          (root / "manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n", encoding="utf-8"
          )
          (root / "pin-candidate.toml").write_text(
              "# Measured by the full-corpus calibration gate. Human-review before commit.\n"
              "[calibration]\n"
              f"minimum_relevance_score = {threshold:.6f}\n",
              encoding="utf-8",
          )
          PY

      - name: Upload calibration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tractusmind-calibration-${{ github.sha }}
          path: artifacts/calibration
          if-no-files-found: warn
          retention-days: 90
