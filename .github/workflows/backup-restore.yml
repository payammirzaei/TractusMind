name: Backup Restore

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/backup-restore.yml"
      - "alembic/**"
      - "app/**/models.py"
      - "app/db/**"
      - "scripts/release_preflight.py"

permissions:
  contents: read

jobs:
  postgres-backup-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.10-alpine
        env:
          POSTGRES_DB: tractusmind
          POSTGRES_USER: tractusmind
          POSTGRES_PASSWORD: tractusmind
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tractusmind -d tractusmind"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://tractusmind:tractusmind@127.0.0.1:5432/tractusmind
      POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Install database tooling
        run: python -m pip install -e ".[dev]"

      - name: Bootstrap current schema
        run: tractusmind-db bootstrap

      - name: Seed backup canary
        shell: bash
        run: |
          set -euo pipefail
          docker exec "$POSTGRES_CONTAINER_ID" \
            psql -v ON_ERROR_STOP=1 -U tractusmind -d tractusmind -c \
            "INSERT INTO source_state (source_id, repository, component, version_ref, snapshot_commit_sha) VALUES ('backup-smoke', 'eclipse-tractusx/backup-smoke', 'backup-smoke', 'main', repeat('a', 40));"

      - name: Create portable PostgreSQL backup
        shell: bash
        run: |
          set -euo pipefail
          docker exec "$POSTGRES_CONTAINER_ID" \
            pg_dump -U tractusmind -d tractusmind \
            --format=custom --no-owner --no-privileges \
            --file=/tmp/tractusmind.dump
          test "$(docker exec "$POSTGRES_CONTAINER_ID" stat -c %s /tmp/tractusmind.dump)" -gt 1024

      - name: Restore into clean database
        shell: bash
        run: |
          set -euo pipefail
          docker exec "$POSTGRES_CONTAINER_ID" \
            createdb -U tractusmind -O tractusmind tractusmind_restore
          docker exec "$POSTGRES_CONTAINER_ID" \
            pg_restore -v -U tractusmind -d tractusmind_restore \
            --no-owner --no-privileges /tmp/tractusmind.dump

      - name: Verify restored schema and canary data
        shell: bash
        run: |
          set -euo pipefail
          table_count="$(docker exec "$POSTGRES_CONTAINER_ID" psql -U tractusmind -d tractusmind_restore -Atc \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_type = 'BASE TABLE';")"
          if [ "$table_count" -lt 5 ]; then
            echo "Restored schema has too few public tables: $table_count" >&2
            exit 1
          fi

          canary="$(docker exec "$POSTGRES_CONTAINER_ID" psql -U tractusmind -d tractusmind_restore -Atc \
            "SELECT repository FROM source_state WHERE source_id = 'backup-smoke';")"
          test "$canary" = "eclipse-tractusx/backup-smoke"

          migration_rows="$(docker exec "$POSTGRES_CONTAINER_ID" psql -U tractusmind -d tractusmind_restore -Atc \
            "SELECT count(*) FROM alembic_version;")"
          test "$migration_rows" -ge 1

          echo "PostgreSQL backup/restore smoke: PASS ($table_count public tables, canary restored)"
