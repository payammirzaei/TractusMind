name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://tractusmind:tractusmind@localhost:5432/tractusmind
    services:
      postgres:
        image: postgres:17.10-alpine
        env:
          POSTGRES_DB: tractusmind
          POSTGRES_USER: tractusmind
          POSTGRES_PASSWORD: tractusmind
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tractusmind -d tractusmind"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Prepare deployment validation fixtures
        run: |
          cp .env.example .env
          cp .env.production.example .env.production
          mkdir -p secrets
          printf '%s\n' 'postgresql+asyncpg://tractusmind:ci-password@postgres:5432/tractusmind' > secrets/database_url
          printf '%s\n' 'ci-password' > secrets/postgres_password
          printf '%s\n' 'redis://:ci-redis@redis:6379/0' > secrets/redis_url
          printf '%s\n' 'ci-redis' > secrets/redis_password
          printf '%s\n' 'ci-llm-key' > secrets/llm_api_key
          printf '%s\n' 'ci-github-token' > secrets/github_token
          printf '%s\n' 'ci-ops-key' > secrets/ops_admin_key
          printf '%s\n' 'ci-metrics-key' > secrets/metrics_admin_key
          printf '%s\n' 'ci-grafana-password' > secrets/grafana_admin_password

      - name: Validate Prometheus development configuration
        run: >-
          docker run --rm
          --entrypoint promtool
          -v "$PWD/config:/etc/prometheus:ro"
          prom/prometheus:v3.13.1
          check config /etc/prometheus/prometheus.yml

      - name: Validate Prometheus production configuration
        run: >-
          docker run --rm
          --entrypoint promtool
          -v "$PWD/config:/etc/prometheus:ro"
          -v "$PWD/secrets/metrics_admin_key:/run/secrets/metrics_admin_key:ro"
          prom/prometheus:v3.13.1
          check config /etc/prometheus/prometheus.prod.yml

      - name: Validate Alertmanager configuration
        run: >-
          docker run --rm
          --entrypoint amtool
          -v "$PWD/config:/etc/alertmanager:ro"
          prom/alertmanager:v0.33.1
          check-config /etc/alertmanager/alertmanager.yml

      - name: Validate Grafana dashboards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          paths = sorted(Path("config/grafana/dashboards").glob("*.json"))
          assert paths, "No Grafana dashboard JSON files found"
          for path in paths:
              payload = json.loads(path.read_text(encoding="utf-8"))
              assert payload.get("uid"), f"{path}: missing uid"
              assert payload.get("title"), f"{path}: missing title"
              assert payload.get("panels"), f"{path}: no panels"
              print(f"validated {path}")
          PY

      - name: Validate development Compose configuration
        run: docker compose config --quiet

      - name: Validate production Compose configuration
        run: >-
          docker compose
          --env-file .env.production
          -f docker-compose.prod.yml
          config --quiet

      - name: Bootstrap database
        run: tractusmind-db bootstrap

      - name: Check database revision
        run: tractusmind-db check

      - name: Check ORM migration drift
        run: tractusmind-db drift

      - name: Test
        run: pytest -q

      - name: Legacy adoption smoke test
        run: |
          python - <<'PY'
          import asyncio

          from sqlalchemy import text

          from app.core.config import get_settings
          from app.infra.postgres import create_postgres_engine

          async def main() -> None:
              engine = create_postgres_engine(get_settings())
              try:
                  async with engine.begin() as connection:
                      await connection.execute(text("DROP TABLE alembic_version"))
              finally:
                  await engine.dispose()

          asyncio.run(main())
          PY
          tractusmind-db bootstrap
          tractusmind-db check

      - name: Migration rollback smoke test
        run: |
          tractusmind-db downgrade 0001_core_schema
          tractusmind-db upgrade head
          tractusmind-db check
          tractusmind-db drift
