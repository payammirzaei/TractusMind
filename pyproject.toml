[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tractusmind"
version = "0.1.0"
description = "Source-grounded AI engineering copilot for the Tractus-X ecosystem."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Payam Mirzaei" }]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "qdrant-client>=1.12,<2.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "asyncpg>=0.29,<1.0",
  "redis>=5.2,<7.0",
  "dramatiq[redis]>=1.17,<3.0",
  "httpx>=0.27,<1.0",
  "structlog>=24.4,<27.0",
  "tree-sitter>=0.26,<0.27",
  "tree-sitter-language-pack>=1.14.1,<2.0",
  "sentence-transformers>=3.2,<6.0",
]

[project.scripts]
tractusmind-ingest = "app.ingestion.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10.0",
  "pytest-asyncio>=0.24,<2.0",
  "ruff>=0.8,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
