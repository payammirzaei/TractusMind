# Official Tractus-X knowledge sources for TractusMind.
#
# The registry is intentionally allowlist-based. We do not crawl the whole
# Eclipse Tractus-X organization because archived, generated, historical, or
# very large repositories can reduce retrieval quality.

[[sources]]
id = "tractusx-sdk"
provider = "github"
owner = "eclipse-tractusx"
repo = "tractusx-sdk"
component = "sdk"
priority = "critical"
ref = "main"
enabled = true
allow_archived = false
max_file_bytes = 1000000
include = [
  "README.md",
  "docs/**/*.md",
  "examples/**/*.py",
  "tractusx_sdk/**/*.py",
  "**/*.json",
  "**/*.jsonld",
  "**/*.yaml",
  "**/*.yml",
]
exclude = [
  "**/.venv/**",
  "**/__pycache__/**",
  "**/node_modules/**",
  "**/dist/**",
  "**/build/**",
  "**/site/**",
  "**/coverage/**",
]

