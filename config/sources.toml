# Core Tractus-X knowledge sources for TractusMind.
#
# These six sources have hand-tuned selection rules because they form the
# high-signal core corpus. The rest of the Eclipse Tractus-X organization is
# represented by app/ingestion/catalog.py: useful active repositories are
# enabled for indexing, while archived/meta/asset-only repositories remain
# visible in Mission Control without polluting retrieval.

[[sources]]
id = "tractusx-sdk"
provider = "github"
owner = "eclipse-tractusx"
repo = "tractusx-sdk"
component = "sdk"
domain = "sdk"
source_type = "library"
catalog_state = "active"
priority = "critical"
ref = "main"
enabled = true
allow_archived = false
max_file_bytes = 1000000
include = [
  "README.md",
  "docs/**/*.md",
  "examples/**/*.py",
  "tractusx_sdk/**/*.py",
  "**/*.json",
  "**/*.jsonld",
  "**/*.yaml",
  "**/*.yml",
]
exclude = [
  "**/.venv/**",
  "**/__pycache__/**",
  "**/node_modules/**",
  "**/dist/**",
  "**/build/**",
  "**/site/**",
  "**/coverage/**",
]

[[sources]]
id = "tractusx-edc"
provider = "github"
owner = "eclipse-tractusx"
repo = "tractusx-edc"
component = "edc"
domain = "data-exchange"
source_type = "core"
catalog_state = "active"
priority = "critical"
