global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: tractusmind-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_admin_key
    static_configs:
      - targets: ["api:8000"]

  - job_name: tractusmind-worker-domain
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9101"]

  - job_name: tractusmind-worker-dramatiq
    metrics_path: /
    static_configs:
      - targets: ["worker:9191"]

  - job_name: tractusmind-scheduler
    metrics_path: /metrics
    static_configs:
      - targets: ["scheduler:9102"]
